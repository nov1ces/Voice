name: Fork release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name
        required: true
        default: 1.0.0-ffmpeg.5
        type: string
      version_code:
        description: Increasing Android version code
        required: true
        default: '5'
        type: string

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      FFMPEG_JOBS: '2'
      FORK_SIGNING_CERT_SHA256: f9ec60f7dd30e70216dc6d154348736acac3ebf36eba68b9461d985267ef54d1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release inputs
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Dispatch this workflow from main." >&2
            exit 1
          fi
          python3 - <<'PYTHON'
          import os
          import re

          version_name = os.environ["VERSION_NAME"]
          version_code = os.environ["VERSION_CODE"]
          if len(version_name) > 128 or not re.fullmatch(
              r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?",
              version_name,
          ):
              raise SystemExit("Invalid release version name.")
          if not re.fullmatch(r"[1-9][0-9]{0,9}", version_code) or int(version_code) > 2100000000:
              raise SystemExit("Version code must be between 1 and 2100000000.")
          PYTHON
          existing_tag=$(git ls-remote --tags origin "refs/tags/$VERSION_NAME")
          if [[ -n "$existing_tag" ]]; then
            echo "The release tag already exists: $VERSION_NAME" >&2
            exit 1
          fi
      - name: Check signing secrets
        env:
          GH_SIGNING_KEYSTORE: ${{ secrets.GH_SIGNING_KEYSTORE != '' }}
          GH_SIGNING_STORE_PASSWORD: ${{ secrets.GH_SIGNING_STORE_PASSWORD != '' }}
          GH_SIGNING_KEY_ALIAS: ${{ secrets.GH_SIGNING_KEY_ALIAS != '' }}
          GH_SIGNING_KEY_PASSWORD: ${{ secrets.GH_SIGNING_KEY_PASSWORD != '' }}
        run: |
          missing=false
          for variable in GH_SIGNING_KEYSTORE GH_SIGNING_STORE_PASSWORD GH_SIGNING_KEY_ALIAS GH_SIGNING_KEY_PASSWORD; do
            if [[ "${!variable}" != true ]]; then
              echo "Missing signing secret: $variable" >&2
              missing=true
            fi
          done
          if [[ "$missing" == true ]]; then
            exit 1
          fi
      - uses: ./.github/actions/build_setup
      - name: Set up fork signing
        env:
          KEYSTORE: ${{ secrets.GH_SIGNING_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.GH_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GH_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GH_SIGNING_KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing signing secret: $variable" >&2
              exit 1
            fi
          done
          python3 - <<'PYTHON'
          import base64
          import os
          from pathlib import Path

          signing = Path("signing")
          signing.mkdir(exist_ok=True)
          keystore = signing / "signing.keystore"
          keystore.write_bytes(base64.b64decode(os.environ["KEYSTORE"]))
          keystore.chmod(0o600)
          properties = signing / "signing.properties"
          with properties.open("w", encoding="ascii") as output:
              for key in ("STORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD"):
                  value = os.environ[key].encode("utf-16-be")
                  escaped = "".join("\\u" + value[i:i + 2].hex() for i in range(0, len(value), 2))
                  output.write(key + "=" + escaped + "\n")
          properties.chmod(0o600)
          PYTHON
      - name: Run playback tests and app lint
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          ./gradlew :core:scanner:testDebugUnitTest :core:playback:impl:testDebugUnitTest \
            :features:playbackScreen:testDebugUnitTest :app:lintFreeRelease \
            -Pvoice.versionName="$VERSION_NAME" -Pvoice.versionCode="$VERSION_CODE" \
            --no-configuration-cache -Dorg.gradle.unsafe.isolated-projects=false --max-workers=2 \
            -Dorg.gradle.jvmargs='-Dfile.encoding=UTF-8 -XX:+ExitOnOutOfMemoryError -XX:MaxMetaspaceSize=1g -Xms256m -Xmx4g'
      - name: Build signed APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          ./gradlew :app:assembleFreeRelease \
            -Pvoice.versionName="$VERSION_NAME" \
            -Pvoice.versionCode="$VERSION_CODE" \
            --no-configuration-cache -Dorg.gradle.unsafe.isolated-projects=false --max-workers=2 \
            -Dorg.gradle.jvmargs='-Dfile.encoding=UTF-8 -XX:+ExitOnOutOfMemoryError -XX:MaxMetaspaceSize=1g -Xms256m -Xmx4g'
      - name: Verify signed APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          STORE_PASSWORD: ${{ secrets.GH_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GH_SIGNING_KEY_ALIAS }}
        run: |
          apk=app/build/outputs/apk/free/release/app-free-release.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          expected_certificate=$(keytool -exportcert -keystore signing/signing.keystore \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)
          actual_certificate=$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | sed -n '1p')
          if [[ "$actual_certificate" != "$expected_certificate" || "$actual_certificate" != "$FORK_SIGNING_CERT_SHA256" ]]; then
            echo "APK certificate does not match the existing fork release key." >&2
            exit 1
          fi
          printf 'APK signing certificate SHA-256: %s\n' "$actual_certificate"
          "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import zipfile

          output = Path("app/build/outputs/apk/free/release")
          metadata = json.loads((output / "output-metadata.json").read_text())
          elements = metadata["elements"]
          if len(elements) != 1:
              raise SystemExit("Expected one universal APK.")
          element = elements[0]
          if (
              element["outputFile"] != "app-free-release.apk"
              or element["versionName"] != os.environ["VERSION_NAME"]
              or element["versionCode"] != int(os.environ["VERSION_CODE"])
          ):
              raise SystemExit("APK version does not match the release inputs.")
          expected_abis = {"armeabi-v7a", "arm64-v8a", "x86", "x86_64"}
          with zipfile.ZipFile(output / element["outputFile"]) as apk:
              names = set(apk.namelist())
              actual_abis = {name.split("/")[1] for name in names if name.startswith("lib/") and name.endswith(".so")}
              if actual_abis != expected_abis:
                  raise SystemExit("APK must contain exactly the four supported ABIs.")
              for abi in expected_abis:
                  library = f"lib/{abi}/libffmpegJNI.so"
                  if library not in names or apk.getinfo(library).file_size == 0:
                      raise SystemExit(f"Missing FFmpeg library: {abi}")
                  if apk.getinfo(library).compress_type != zipfile.ZIP_STORED:
                      raise SystemExit(f"FFmpeg library must be uncompressed: {abi}")
          print("Verified APK version and all four FFmpeg ABIs.")
          PYTHON
      - name: Prepare release files
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/free/release/app-free-release.apk "artifacts/Voice-$VERSION_NAME.apk"
          cp core/ffmpeg/build/ffmpeg/ffmpeg-6.1.6.tar.xz artifacts/
          git archive --format=tar.gz --prefix=Voice/ -o artifacts/Voice-source.tar.gz "$GITHUB_SHA"
          (cd artifacts && sha256sum *.apk *.tar.* > SHA256SUMS)
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          existing_tag=$(git ls-remote --tags origin "refs/tags/$VERSION_NAME")
          if [[ -n "$existing_tag" ]]; then
            echo "The release tag already exists: $VERSION_NAME" >&2
            exit 1
          fi
          gh release create "$VERSION_NAME" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Voice $VERSION_NAME" \
            --draft \
            --notes-file .github/ffmpeg_release_notes.md
          gh release edit "$VERSION_NAME" --draft=false --latest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fork-release
          path: artifacts/
          if-no-files-found: ignore
